name: API Tests

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://jsonplaceholder.typicode.com
      TIMEOUT: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: pytest -v